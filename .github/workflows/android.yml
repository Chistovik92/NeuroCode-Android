name: Android build

on:
  push:
    branches: ["main", "master"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android native toolchain
        shell: bash
        run: |
          sdkmanager="$(command -v sdkmanager || true)"
          if [[ -z "$sdkmanager" ]]; then
            sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          fi
          yes_input="$(mktemp)"
          printf 'y\n%.0s' $(seq 1 100) > "$yes_input"
          "$sdkmanager" --licenses < "$yes_input" >/dev/null
          "$sdkmanager" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;29.0.13113456" \
            "cmake;3.31.6" < "$yes_input"

      - name: Unit tests and debug APK
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug

      - name: Static analysis (detekt)
        run: ./gradlew --no-daemon :app:detekt

      - name: Compact signed arm64 APK
        shell: bash
        run: |
          ks="$(find "$HOME/.android" "$HOME/.gradle" -name debug.keystore 2>/dev/null | head -n1 || true)"
          if [[ -z "$ks" ]]; then
            mkdir -p "$HOME/.android"
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -alias androiddebugkey -storepass android -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            ks="$HOME/.android/debug.keystore"
          fi
          ./scripts/make-compact-apk.sh \
            "app/build/outputs/apk/debug/app-arm64-v8a-debug.apk" \
            "dist/NeuroCode-arm64-v8a-debug.apk" \
            "$ks"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: neurocode-debug-apk
          path: |
            dist/NeuroCode-arm64-v8a-debug.apk
            app/build/outputs/apk/debug/app-x86_64-debug.apk
          if-no-files-found: error

      - name: Prepare release signing
        id: release_prep
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.RELEASE_KEY_PASSWORD }}
        shell: bash
        run: |
          if [[ -n "$KEYSTORE_B64" && -n "$STORE_PASS" && -n "$KEY_ALIAS" && -n "$KEY_PASS" ]]; then
            key_path="$GITHUB_WORKSPACE/release.keystore.jks"
            echo "$KEYSTORE_B64" | base64 -d > "$key_path"
            {
              echo "storeFile=$key_path"
              echo "storePassword=$STORE_PASS"
              echo "keyAlias=$KEY_ALIAS"
              echo "keyPassword=$KEY_PASS"
            } > keystore.properties
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Секреты release-подписи не заданы — подписанный release пропущен."
          fi

      - name: Signed release APK
        if: steps.release_prep.outputs.available == 'true'
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Upload release APK
        if: steps.release_prep.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: neurocode-release-apk
          path: app/build/outputs/apk/release/app-*-release.apk
          if-no-files-found: error

  instrumented:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android native toolchain
        shell: bash
        run: |
          sdkmanager="$(command -v sdkmanager || true)"
          if [[ -z "$sdkmanager" ]]; then
            sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          fi
          yes_input="$(mktemp)"
          printf 'y\n%.0s' $(seq 1 100) > "$yes_input"
          "$sdkmanager" --licenses < "$yes_input" >/dev/null
          "$sdkmanager" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;29.0.13113456" \
            "cmake;3.31.6" < "$yes_input"

      - name: Smoke test on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          script: ./gradlew --no-daemon connectedDebugAndroidTest
