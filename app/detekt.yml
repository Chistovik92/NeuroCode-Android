complexity:
  TooManyFunctions:
    thresholdInClasses: 16
  LargeClass:
    active: false
naming:
  FunctionNaming:
    ignoreAnnotated:
      - 'Composable'
style:
  MagicNumber:
    ignoreAnnotated:
      - 'Composable'
    ignorePropertyDeclaration: true
  MaxLineLength:
    excludeCommentStatements: true
